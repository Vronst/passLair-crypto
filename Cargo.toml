[package]
name = "passlair_crypto"
version = "0.1.5"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.11.0"
pyo3 = "0.29.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }

[dev-dependencies]
# Only pulled in for `cargo test`'s own standalone binary, which needs an
# interpreter to attach to for the derive_keys/derive_new_keys tests below
# (they now take a `Python` token). maturin's extension-module build (the
# actual shipped wheel) never sees this -- dev-dependency features aren't
# unified into the library artifact.
pyo3 = { version = "0.29.0", features = ["auto-initialize"] }
